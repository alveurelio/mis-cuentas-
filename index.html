<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#B85C6B">
<title>Mis Cuentas</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --rose:#B85C6B;
    --rose-light:#F3DCE0;
    --rose-dark:#8F4353;
    --sage:#5C7A6E;
    --sage-light:#DCE8E2;
    --cream:#FBF6F1;
    --paper:#FFFFFF;
    --ink:#2E2622;
    --ink-soft:#7A6F68;
    --line:#EBE0D8;
    --gold:#C9A15A;
    --danger:#C25450;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow:0 2px 10px rgba(46,38,34,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--cream);
    color:var(--ink);
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--cream);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* ---- Encabezado ---- */
  .topbar{
    padding:22px 20px 16px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .topbar h1{
    font-size:26px;
    margin:0;
    font-weight:800;
    letter-spacing:-0.3px;
  }
  .topbar .fecha{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:600;
  }
  /* ---- Contenido con scroll ---- */
  .screen{
    flex:1;
    padding:0 20px 100px;
    display:none;
  }
  .screen.activa{display:block;}
  /* ---- Tarjetas ---- */
  .card{
    background:var(--paper);
    border-radius:var(--radius-lg);
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:14px;
  }
  .card h2{
    font-size:15px;
    margin:0 0 12px;
    font-weight:800;
    color:var(--ink);
  }
  /* ---- Navegación inferior ---- */
  nav.tabbar{
    position:sticky;
    bottom:0;
    left:0;
    right:0;
    background:var(--paper);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    max-width:480px;
    margin:0 auto;
    width:100%;
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px 2px;
    font-family:inherit;
    color:var(--ink-soft);
    font-size:11px;
    font-weight:700;
    border-radius:var(--radius-sm);
  }
  nav.tabbar button .ic{font-size:20px; line-height:1;}
  nav.tabbar button.activo{color:var(--rose-dark);}
  nav.tabbar button.activo .ic{transform:scale(1.08);}
  /* ---- Botón flotante registrar ---- */
  .fab{
    position:fixed;
    bottom:78px;
    left:50%;
    transform:translateX(-50%);
    width:62px;
    height:62px;
    border-radius:50%;
    background:var(--rose);
    color:#fff;
    border:none;
    font-size:30px;
    box-shadow:0 6px 16px rgba(184,92,107,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    max-width:480px;
  }
  .fab:active{transform:translateX(-50%) scale(0.94);}
  /* ---- Utilidades ---- */
  .fila{display:flex; justify-content:space-between; align-items:center;}
  .monto-ingreso{color:var(--sage); font-weight:800;}
  .monto-gasto{color:var(--danger); font-weight:800;}
  .muted{color:var(--ink-soft); font-size:13px;}
  .btn{
    display:block;
    width:100%;
    padding:15px;
    border-radius:var(--radius-md);
    border:none;
    font-family:inherit;
    font-weight:800;
    font-size:15px;
    text-align:center;
  }
  .btn-primary{background:var(--rose); color:#fff;}
  .btn-secondary{background:var(--sage-light); color:var(--sage);}
  .btn-ghost{background:none; color:var(--ink-soft); font-weight:700;}
  .btn-danger{background:#FBEAE9; color:var(--danger);}
  input, textarea, select{
    font-family:inherit;
    font-size:16px;
    border:1.5px solid var(--line);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    width:100%;
    background:var(--paper);
    color:var(--ink);
  }
  input:focus, textarea:focus{outline:2px solid var(--rose); outline-offset:1px;}
  label.campo{display:block; margin-bottom:16px;}
  label.campo span{display:block; font-size:13px; font-weight:800; color:var(--ink-soft); margin-bottom:6px;}
  /* ---- Modal / hoja inferior ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(46,38,34,0.45);
    z-index:100; display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .overlay.activo{display:flex;}
  .hoja{
    background:var(--cream);
    width:100%;
    max-width:480px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:24px 24px 0 0;
    padding:14px 20px calc(24px + env(safe-area-inset-bottom));
    animation:subir .22s ease-out;
  }
  @keyframes subir{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .asa{width:40px; height:4px; background:var(--line); border-radius:2px; margin:6px auto 14px;}
  .hoja h2{font-size:19px; margin:0 0 16px; font-weight:800;}
  /* ---- Scroller de tarjetas horizontales ---- */
  .scroller{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:4px 2px 10px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .scroller::-webkit-scrollbar{display:none;}
  .chip{
    scroll-snap-align:start;
    flex:0 0 auto;
    background:var(--paper);
    border:2px solid var(--line);
    border-radius:var(--radius-md);
    padding:12px 16px;
    font-weight:800;
    font-size:13.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    min-width:76px;
  }
  .chip .ic{font-size:22px;}
  .chip.sel{border-color:var(--rose); color:var(--rose-dark); background:var(--rose-light);}
  /* ---- segmentado tipo ingreso/gasto ---- */
  .segmentado{
    display:flex;
    background:var(--rose-light);
    border-radius:var(--radius-md);
    padding:4px;
    margin-bottom:18px;
  }
  .segmentado button{
    flex:1;
    border:none;
    background:none;
    padding:11px;
    border-radius:10px;
    font-family:inherit;
    font-weight:800;
    font-size:14px;
    color:var(--rose-dark);
  }
  .segmentado button.sel{background:var(--rose); color:#fff;}
  .segmentado.gasto{background:#FBEAE9;}
  .segmentado.gasto button{color:var(--danger);}
  .segmentado.gasto button.sel{background:var(--danger); color:#fff;}
  /* ---- vacío ---- */
  .vacio{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
  }
  .vacio .ic{font-size:40px; display:block; margin-bottom:10px;}
  /* ---- barra de progreso ---- */
  .barra-fondo{
    background:var(--sage-light);
    border-radius:20px;
    height:22px;
    overflow:hidden;
    margin:10px 0;
  }
  .barra-rellena{
    background:linear-gradient(90deg, var(--gold), var(--sage));
    height:100%;
    border-radius:20px;
    transition:width .4s ease;
    min-width:6%;
  }
  /* ---- toast ---- */
  #toast{
    position:fixed; bottom:150px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:30px;
    font-size:13.5px; font-weight:700; opacity:0; pointer-events:none;
    transition:all .25s; z-index:200; max-width:90%; text-align:center;
  }
  #toast.mostrar{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <h1 id="tituloPantalla">Inicio</h1>
    <span class="fecha" id="fechaHoy"></span>
  </div>

  <!-- ===== PANTALLA INICIO ===== -->
  <section class="screen activa" id="screen-inicio"></section>

  <!-- ===== PANTALLA DEUDAS ===== -->
  <section class="screen" id="screen-deudas"></section>

  <!-- ===== PANTALLA ANÁLISIS ===== -->
  <section class="screen" id="screen-analisis"></section>

  <!-- ===== PANTALLA META ===== -->
  <section class="screen" id="screen-meta"></section>

  <!-- ===== PANTALLA HISTORIAL ===== -->
  <section class="screen" id="screen-historial"></section>

  <button class="fab" id="btnRegistrar">+</button>

  <nav class="tabbar">
    <button class="tab activo" data-tab="inicio"><span class="ic">🏠</span>Inicio</button>
    <button class="tab" data-tab="deudas"><span class="ic">🤝</span>Deudas</button>
    <button class="tab" data-tab="analisis"><span class="ic">📊</span>Análisis</button>
    <button class="tab" data-tab="meta"><span class="ic">🎯</span>Meta</button>
    <button class="tab" data-tab="historial"><span class="ic">📒</span>Historial</button>
  </nav>
</div>

<div id="toast"></div>

<!-- Los overlays (modales) se insertan por JS -->

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
